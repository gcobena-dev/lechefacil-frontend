apply plugin: 'com.android.application'

import groovy.json.JsonSlurper

// package.json es la única fuente de la versión: el pipeline sólo bumpea ahí y
// el APK se deriva, así que versionName/versionCode no pueden quedar rezagados
// como pasó hasta v0982 (todos los APK publicados salieron con versionCode 1).
def lfPackageJson = new JsonSlurper().parse(file("../../package.json"))
def lfVersionName = lfPackageJson.version

// versionCode tiene que crecer siempre o Android rechaza la instalación, así que
// no vale concatenar los dígitos: 0.1.0 daría 10, menor que el 983 de 0.0.983.
// major*1000000 + minor*1000 + patch sí es monótono (0.0.983 -> 983,
// 0.1.0 -> 1000, 1.0.0 -> 1000000).
def lfVersionParts = lfVersionName.tokenize('.').collect { part ->
    def digits = part.replaceAll(/[^0-9]/, '')
    digits ? digits.toInteger() : 0
}
while (lfVersionParts.size() < 3) { lfVersionParts << 0 }
def lfVersionCode = lfVersionParts[0] * 1000000 + lfVersionParts[1] * 1000 + lfVersionParts[2]


android {
    namespace "com.lechefacil.app"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.lechefacil.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Derivados de package.json (ver arriba). El servidor compara este
        // versionCode contra `minNativeBuild` de version.json para decidir si
        // este APK puede correr el bundle OTA publicado.
        versionCode lfVersionCode
        versionName lfVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    signingConfigs {
        release {
            // Variables de entorno en CI, archivo local si no las hay.
            def keystorePath = System.getenv("RELEASE_KEYSTORE_FILE") ?: "release.keystore"
            def resolvedKeystore = file(keystorePath)
            if (resolvedKeystore.exists()) {
                storeFile resolvedKeystore
                storePassword System.getenv("RELEASE_KEYSTORE_PASSWORD") ?: "android"
                keyAlias System.getenv("RELEASE_KEY_ALIAS") ?: "lechefacil"
                // La contraseña de la clave puede diferir de la del almacén; hasta
                // ahora el secret KEY_PASSWORD existía pero nadie lo leía.
                keyPassword System.getenv("RELEASE_KEY_PASSWORD")
                    ?: System.getenv("RELEASE_KEYSTORE_PASSWORD") ?: "android"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // Only sign if keystore exists
            if (signingConfigs.release.storeFile != null) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // Firebase BoM to align Firebase library versions
    implementation platform('com.google.firebase:firebase-bom:34.3.0')
    // Firebase products (adjust as needed)
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.firebase:firebase-analytics'
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
