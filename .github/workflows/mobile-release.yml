name: Mobile Release

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from package.json
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "📦 Current version: $VERSION"

          # versionCode real del APK. Mismo cálculo que android/app/build.gradle,
          # que también lo deriva de package.json: si los dos no coinciden, el
          # gate de version.json compara contra un número que nadie tiene.
          VERSION_CODE=$(node -p "const [a=0,b=0,c=0]=require('./package.json').version.split('.').map(p=>parseInt(p,10)||0); a*1000000+b*1000+c")
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "🔢 versionCode: $VERSION_CODE"

          # Piso nativo: el versionCode de APK mínimo que este bundle necesita.
          # Sin esto en version.json el servidor no puede frenar la entrega de un
          # bundle a un shell que no lo puede correr, que es como el arreglo del
          # botón atrás de v096 quedó muerto en los equipos durante meses.
          MIN_NATIVE_BUILD=$(node -p "require('./package.json').minNativeBuild ?? ''")
          if [ -z "$MIN_NATIVE_BUILD" ]; then
            echo "❌ Falta 'minNativeBuild' en package.json."
            echo "   Es el versionCode de APK mínimo que este bundle necesita."
            echo "   Ver la sección de releases en MOBILE.md."
            exit 1
          fi
          if [ "$MIN_NATIVE_BUILD" -gt "$VERSION_CODE" ]; then
            echo "❌ minNativeBuild ($MIN_NATIVE_BUILD) es mayor que el versionCode"
            echo "   de este build ($VERSION_CODE): ningún APK podría correr el bundle."
            exit 1
          fi
          echo "min_native_build=$MIN_NATIVE_BUILD" >> "$GITHUB_OUTPUT"
          echo "🔒 minNativeBuild: $MIN_NATIVE_BUILD"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Check if version changed
        id: check
        env:
          S3_MOBILE_BUCKET: ${{ secrets.S3_MOBILE_BUCKET }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          # Check if version.json exists in S3
          if aws s3 ls "s3://${S3_MOBILE_BUCKET}/version.json" 2>/dev/null; then
            # Download and extract last deployed version
            aws s3 cp "s3://${S3_MOBILE_BUCKET}/version.json" /tmp/version.json
            LAST_VERSION=$(node -p "require('/tmp/version.json').version")
            echo "📋 Last deployed version: $LAST_VERSION"

            if [ "$VERSION" == "$LAST_VERSION" ]; then
              echo "changed=false" >> "$GITHUB_OUTPUT"
              echo "⏭️  Version $VERSION already deployed, skipping build"
              exit 0
            else
              echo "changed=true" >> "$GITHUB_OUTPUT"
              echo "✅ Version changed from $LAST_VERSION to $VERSION"
            fi
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "✅ First deployment, version $VERSION"
          fi

      - name: Setup Node.js
        if: steps.check.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java 21
        if: steps.check.outputs.changed == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        if: steps.check.outputs.changed == 'true'
        run: npm ci

      - name: Build production app
        if: steps.check.outputs.changed == 'true'
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Sync Capacitor
        if: steps.check.outputs.changed == 'true'
        run: npx cap sync android

      # La keystore se restaura desde un secret, NUNCA se genera acá.
      #
      # Antes este paso corría `keytool -genkey` en cada corrida, así que cada
      # APK publicado salía firmado con una llave distinta. Android rechaza
      # actualizar una app cuando cambia el certificado de firma
      # (INSTALL_FAILED_UPDATE_INCOMPATIBLE), de modo que cada release obligaba
      # a desinstalar —perdiendo la cola offline, que es el único lugar donde
      # viven los registros que el ganadero cargó sin señal— y además hacía
      # imposible publicar en Play Store, que exige una llave estable.
      - name: Restore release keystore
        if: steps.check.outputs.changed == 'true'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "❌ Falta el secret RELEASE_KEYSTORE_BASE64."
            echo ""
            echo "   Generá la keystore UNA sola vez y guardala fuera del repo:"
            echo ""
            echo "     keytool -genkey -v -keystore lechefacil-release.keystore \\"
            echo "       -alias lechefacil -keyalg RSA -keysize 2048 -validity 10000"
            echo ""
            echo "     base64 -i lechefacil-release.keystore | pbcopy"
            echo "     gh secret set RELEASE_KEYSTORE_BASE64 --repo <owner>/<repo>"
            echo ""
            echo "   Si se pierde ese archivo no se puede volver a publicar una"
            echo "   actualización de la app instalada: guardá una copia."
            echo "   Ver MOBILE.md, sección de firma."
            exit 1
          fi

          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore

          if [ ! -s android/app/release.keystore ]; then
            echo "❌ RELEASE_KEYSTORE_BASE64 no decodifica a un archivo válido."
            exit 1
          fi

          # Falla temprano si la contraseña no abre el almacén, en vez de dejar
          # que gradle produzca un APK sin firmar más adelante.
          if ! keytool -list -keystore android/app/release.keystore \
               -storepass "${KEYSTORE_PASSWORD:-android}" >/dev/null 2>&1; then
            echo "❌ KEYSTORE_PASSWORD no abre la keystore."
            exit 1
          fi

          echo "🔐 Keystore restaurada y verificada"
          keytool -list -v -keystore android/app/release.keystore \
            -storepass "${KEYSTORE_PASSWORD:-android}" 2>/dev/null \
            | grep -E "Alias name|Valid from" | head -4

      - name: Build signed APK
        if: steps.check.outputs.changed == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          chmod +x ./gradlew

          echo "🔨 Building APK with signing..."

          export RELEASE_KEYSTORE_FILE="release.keystore"
          export RELEASE_KEYSTORE_PASSWORD="${KEYSTORE_PASSWORD:-android}"
          export RELEASE_KEY_ALIAS="lechefacil"
          # KEY_PASSWORD puede diferir de la del almacén; hasta ahora el secret
          # existía pero el workflow usaba KEYSTORE_PASSWORD para las dos.
          export RELEASE_KEY_PASSWORD="${KEY_PASSWORD:-${KEYSTORE_PASSWORD:-android}}"

          ./gradlew assembleRelease --stacktrace

      - name: List APK outputs (debug)
        if: steps.check.outputs.changed == 'true'
        run: |
          echo "📋 Listing APK output directory:"
          find android/app/build/outputs/apk -type f -name "*.apk" || echo "No APKs found"

      - name: Upload to S3
        if: steps.check.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          MIN_NATIVE_BUILD: ${{ steps.version.outputs.min_native_build }}
          S3_MOBILE_BUCKET: ${{ secrets.S3_MOBILE_BUCKET }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          # Find the release APK (might be app-release-unsigned.apk or app-release.apk)
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)

          if [ -z "$APK" ]; then
            echo "❌ No APK found in android/app/build/outputs/apk/release/"
            exit 1
          fi

          # Gradle nombra el artefacto app-release-unsigned.apk cuando no pudo
          # firmar, y hasta ahora ese archivo se subía igual: se instala en un
          # teléfono sólo con ajustes especiales y no sirve para actualizar.
          case "$APK" in
            *unsigned*)
              echo "❌ El APK salió SIN FIRMAR: $APK"
              echo "   Revisá la keystore y las contraseñas."
              exit 1
              ;;
          esac

          # apksigner confirma QUIÉN firmó; el nombre del archivo de arriba es lo
          # que de verdad bloquea un APK sin firmar. Por eso un problema para
          # ejecutar la herramienta avisa pero no frena el release: sólo un
          # veredicto explícito de "DOES NOT VERIFY" lo hace.
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/Library/Android/sdk}}"
          APKSIGNER=$(find "$SDK/build-tools" -name apksigner -type f 2>/dev/null | sort -V | tail -1)

          if [ -x "$APKSIGNER" ]; then
            echo "🔍 Verificando firma con $APKSIGNER"
            set +e
            SIGNER_OUT=$("$APKSIGNER" verify --print-certs "$APK" 2>&1)
            SIGNER_RC=$?
            set -e

            # Siempre al log: la corrida anterior falló sin dejar rastro de por
            # qué, y sin esta salida no había nada que diagnosticar.
            echo "$SIGNER_OUT" | grep -vF "not protected by signature" | head -20

            if echo "$SIGNER_OUT" | grep -q "DOES NOT VERIFY"; then
              echo "❌ El APK no pasa la verificación de firma."
              exit 1
            elif [ "$SIGNER_RC" -ne 0 ]; then
              echo "⚠️  apksigner devolvió $SIGNER_RC sin un veredicto claro."
              echo "    Se continúa: el APK no es *-unsigned, que es la comprobación que sí bloquea."
            else
              echo "✅ Firma verificada"
            fi
          else
            echo "⚠️  apksigner no encontrado en $SDK/build-tools; se omite la verificación"
          fi

          echo "📦 Found APK: $APK"
          echo "📤 Uploading APK version ${VERSION} to S3..."

          # Upload versioned APK
          aws s3 cp "$APK" \
            "s3://${S3_MOBILE_BUCKET}/lechefacil-${VERSION}.apk" \
            --content-type application/vnd.android.package-archive

          # Upload latest (overwrite)
          aws s3 cp "$APK" \
            "s3://${S3_MOBILE_BUCKET}/lechefacil-latest.apk" \
            --content-type application/vnd.android.package-archive

          # Create update bundle
          echo "📦 Creating update bundle..."
          echo "📋 Contents of dist directory:"
          ls -la dist/

          # Create zip with files at root level (not in dist/ subfolder)
          (cd dist && zip -r ../update.zip .)

          echo "📋 Contents of update.zip:"
          unzip -l update.zip | head -20

          aws s3 cp update.zip \
            "s3://${S3_MOBILE_BUCKET}/updates/${VERSION}.zip"

          # Generate version.json
          echo "📝 Generating version.json..."
          cat > version.json <<EOF
          {
            "version": "${VERSION}",
            "versionCode": ${VERSION_CODE},
            "minNativeBuild": ${MIN_NATIVE_BUILD},
            "apkUrl": "https://${S3_MOBILE_BUCKET}.s3.${AWS_REGION}.amazonaws.com/lechefacil-${VERSION}.apk",
            "latestApkUrl": "https://${S3_MOBILE_BUCKET}.s3.${AWS_REGION}.amazonaws.com/lechefacil-latest.apk",
            "updateBundleUrl": "https://${S3_MOBILE_BUCKET}.s3.${AWS_REGION}.amazonaws.com/updates/${VERSION}.zip",
            "releaseDate": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "minVersion": "0.0.1",
            "changelog": "Release ${VERSION}"
          }
          EOF

          aws s3 cp version.json \
            "s3://${S3_MOBILE_BUCKET}/version.json" \
            --content-type application/json \
            --cache-control "no-cache, must-revalidate"

          echo "✅ Successfully deployed version ${VERSION}"
          echo "📱 APK: https://${S3_MOBILE_BUCKET}.s3.${AWS_REGION}.amazonaws.com/lechefacil-${VERSION}.apk"
